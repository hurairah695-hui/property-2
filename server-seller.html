<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seller · PropDeal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F9;--panel:#fff;--ink:#12263F;--muted:#5A6B80;--line:#D9E0E9;--brand:#1D3F6B;--brand-ink:#fff;--accent:#C79A3B;--err:#B3261E;--focus:#2F6FDE;
--shadow:0 1px 2px rgba(18,38,63,.06),0 10px 28px rgba(18,38,63,.09);
--display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"Figtree","Segoe UI",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0D1521;--panel:#142033;--ink:#E8EDF4;--muted:#9DACBF;--line:#2A3A51;--brand:#D2A94F;--brand-ink:#12263F;--err:#FF8F86;--focus:#7FAAF5;--shadow:0 10px 28px rgba(0,0,0,.4);color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:14px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand svg{width:26px;height:26px}
.search{flex:1;min-width:200px;position:relative;max-width:460px;margin-left:12px}
.search svg{position:absolute;left:14px;top:12px;width:18px;height:18px;color:var(--muted)}
.search input{width:100%;height:42px;padding:0 16px 0 40px;border:1px solid var(--line);border-radius:99px;background:var(--bg);color:var(--ink);font:inherit}
.sp{flex:1}
.btn{height:42px;padding:0 18px;border:0;border-radius:99px;background:var(--brand);color:var(--brand-ink);font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn:hover{opacity:.92}.btn[disabled]{opacity:.6;cursor:progress}
.ghost{height:42px;padding:0 16px;border:1px solid var(--line);border-radius:99px;background:none;color:var(--ink);font-weight:500}
.ghost:hover{border-color:var(--muted)}
.user{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#12263F;display:grid;place-items:center;font-weight:700}

/* hero + filters */
.hero{padding:44px 0 8px}
.hero h1{font-family:var(--display);font-size:clamp(30px,4.6vw,50px);line-height:1.08;letter-spacing:-.025em;margin:0 0 10px;max-width:18ch}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--accent) 55%,transparent) 62%)}
.hero p{margin:0 0 22px;color:var(--muted);max-width:52ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{height:38px;padding:0 16px;border:1px solid var(--line);border-radius:99px;background:var(--panel);color:var(--ink);font-weight:500;font-size:14px}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.count{margin:18px 0 14px;color:var(--muted);font-size:14px}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px;padding-bottom:64px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.ph{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.card:hover .ph img{transform:scale(1.05)}
.tag{position:absolute;left:12px;top:12px;padding:4px 12px;border-radius:99px;background:var(--panel);font-size:12px;font-weight:600}
.heart{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;border:0;background:var(--panel);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.18);transition:transform .15s}
.heart:hover{transform:scale(1.1)}
.heart svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2;transition:fill .15s,stroke .15s}
.heart.on svg{fill:#E5484D;stroke:#E5484D;animation:pop .35s}
@keyframes pop{40%{transform:scale(1.35)}}
.bd{padding:16px 18px 18px}
.pr{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.01em}
.bd h3{margin:2px 0 4px;font-size:16px;font-weight:600}
.loc{margin:0 0 8px;color:var(--muted);font-size:14px}
.ds{margin:0 0 12px;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:500}
.meta span{background:var(--bg);border-radius:8px;padding:3px 10px}
.del{margin-top:12px;border:0;background:none;color:var(--err);font-size:13px;font-weight:600;padding:0}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:18px}

/* modal */
dialog{border:0;border-radius:20px;padding:0;width:min(580px,calc(100% - 24px));background:var(--panel);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,18,30,.55);backdrop-filter:blur(3px)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 4px}
.dh h2{margin:0;font-family:var(--display);font-size:24px}
.x{border:0;background:none;font-size:28px;line-height:1;color:var(--muted)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px 24px}
.fg label{display:block;font-size:13px;font-weight:600}
.full{grid-column:1/-1}
.fg input,.fg select,.fg textarea{display:block;width:100%;margin-top:5px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-weight:400}
.fg small{color:var(--muted);font-weight:400}
#pv{width:100%;max-height:180px;object-fit:cover;border-radius:12px;margin-top:8px}
.df{display:flex;justify-content:flex-end;gap:10px;padding:8px 24px 22px}
#fe{margin:0;padding:0 24px;color:var(--err);font-size:14px;min-height:20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:500;transition:transform .3s;z-index:50}
.toast.show{transform:translate(-50%,0)}
@media(max-width:560px){.fg{grid-template-columns:1fr}.search{order:5;max-width:none;margin:0;flex-basis:100%}.user span{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="5" y="4" width="22" height="24" rx="2" stroke="#C79A3B" stroke-width="2.5"/><path d="M11 10h3M18 10h3M11 15h3M18 15h3M13 28v-6h6v6" stroke="#C79A3B" stroke-width="2.5" stroke-linecap="round"/></svg>
    PropDeal
  </div>
  <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search by title or city" aria-label="Search properties"></label>
  <div class="sp"></div>
  <button class="btn" id="add"><span aria-hidden="true">＋</span> Add property</button>
  <div class="user"><div class="av" id="av">·</div><span id="who"></span></div>
  <button class="ghost" id="out">Log out</button>
</div></header>

<section class="hero"><div class="wrap">
  <h1>List and manage your <em>properties</em></h1>
  <p>Upload houses, apartments, shops and plots, and keep track of the ones you love with the heart.</p>
  <div class="chips" id="chips" role="group" aria-label="Filter by type"></div>
  <div class="count" id="count" aria-live="polite">Loading…</div>
</div></section>

<main class="wrap"><div class="grid" id="grid"></div></main>

<dialog id="dlg">
  <form id="pf" novalidate>
    <div class="dh"><h2>Add a property</h2><button type="button" class="x" id="x" aria-label="Close">×</button></div>
    <div class="fg">
      <label class="full">Title<input name="title" maxlength="150" placeholder="e.g. 5 Marla house near the park"></label>
      <label>Type<select name="type"><option value="house">House</option><option value="apartment">Apartment</option><option value="shop">Shop</option><option value="plot">Plot</option></select></label>
      <label>Price (PKR)<input name="price" type="number" min="1" placeholder="e.g. 15000000"></label>
      <label>City<input name="city" maxlength="80" placeholder="e.g. Islamabad"></label>
      <label>Size<input name="area_size" maxlength="40" placeholder="e.g. 5 Marla"></label>
      <label class="rm">Bedrooms<input name="beds" type="number" min="0" max="50"></label>
      <label class="rm">Bathrooms<input name="baths" type="number" min="0" max="50"></label>
      <label class="full">Description<textarea name="description" rows="3" maxlength="2000"></textarea></label>
      <div class="full"><label>Photo (optional)<input type="file" id="ph" accept="image/jpeg,image/png,image/webp"></label>
        <img id="pv" alt="Photo preview" hidden>
        <small>No photo? We’ll show an illustration for the property type.</small></div>
    </div>
    <p id="fe" role="alert"></p>
    <div class="df"><button type="button" class="ghost" id="cancel">Cancel</button><button class="btn" id="save">Publish</button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const U=id=>'https://images.unsplash.com/photo-'+id+'?auto=format&fit=crop&w=900&q=70';
const PHOTOS={'Modern 10 Marla House, Bahria Town':U('1613977257363-707ba9348227'),'Corner Shop on Main Boulevard':U('1764395294670-22fc367f3119'),'Residential Plot, DHA Phase 2':U('1747854805840-9be7d5e360e6'),'2-Bed Apartment, F-11 Markaz':U('1525953776754-6c4b7ee655ab'),'5 Marla Family Home':U('1513584684374-8bab748fbf90'),'Commercial Plot near Motorway':U('1587745890135-20db8c79b027')};
const LABEL={house:'House',apartment:'Apartment',shop:'Shop',plot:'Plot'};
const HEART='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.2-9.4C1.7 7.8 3.6 4.5 7 4.5c2 0 3.5 1.1 5 3 1.5-1.9 3-3 5-3 3.4 0 5.3 3.3 4.2 6.6-1.7 4.8-9.2 9.4-9.2 9.4z" stroke-linejoin="round"/></svg>';
let me,all=[],type='all',q='',favOnly=false,photo=null;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function money(n){n=+n;const t=v=>v.toFixed(2).replace(/\.?0+$/,'');
  if(n>=1e7)return 'PKR '+t(n/1e7)+' Crore';if(n>=1e5)return 'PKR '+t(n/1e5)+' Lakh';return 'PKR '+n.toLocaleString('en-PK')}
async function api(url,opt){
  const r=await fetch(url,Object.assign({headers:{'Content-Type':'application/json'}},opt));
  const d=await r.json().catch(()=>({}));
  if(r.status===401){location.href='/';throw 0}
  if(!r.ok)throw new Error(d.error||'Something went wrong.');
  return d}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}

/* Illustrations used when a listing has no photo */
const PAL=[['#BFE3F5','#F4F9FC','#F2E8D5','#B5533C','#8CC084'],['#FAD9C1','#FDF3E8','#E6EEF5','#2F5D8A','#9CCB86'],['#CDE7E0','#F3FAF7','#F7EBD0','#7A4B8C','#7DB77A'],['#D8DDF5','#F6F7FD','#EFE3DA','#2E6F66','#A5CF8A']];
function art(t,id){
  const [s1,s2,w,r,g]=PAL[id%4];let b='';
  if(t==='house')b=`<rect x="112" y="140" width="176" height="92" fill="${w}"/><polygon points="96,144 200,68 304,144" fill="${r}"/><rect x="252" y="82" width="20" height="40" fill="${r}" opacity=".8"/><rect x="186" y="176" width="28" height="56" fill="#34495E"/><rect x="130" y="162" width="42" height="34" fill="#CFE8F6"/><rect x="228" y="162" width="42" height="34" fill="#CFE8F6"/><rect x="334" y="196" width="8" height="40" fill="#6B4A32"/><circle cx="338" cy="186" r="28" fill="#5FA36A"/>`;
  else if(t==='apartment'){let k='';for(let y=0;y<5;y++)for(let x=0;x<3;x++)k+=`<rect x="${148+x*38}" y="${58+y*32}" width="22" height="20" fill="${(x+y)%3?'#CFE8F6':'#FFE08A'}"/>`;
    b=`<rect x="64" y="120" width="64" height="112" fill="${r}" opacity=".75"/><rect x="132" y="38" width="136" height="194" fill="${w}"/>${k}<rect x="184" y="196" width="32" height="36" fill="#34495E"/><rect x="272" y="150" width="64" height="82" fill="${r}" opacity=".75"/>`}
  else if(t==='shop'){let a='';for(let i=0;i<8;i++)a+=`<rect x="${70+i*32.5}" y="116" width="32.5" height="34" fill="${i%2?'#FFFFFF':r}"/>`;
    b=`<rect x="70" y="116" width="260" height="116" fill="${w}"/>${a}<rect x="96" y="164" width="130" height="68" fill="#CFE8F6"/><rect x="246" y="170" width="52" height="62" fill="#34495E"/><rect x="150" y="82" width="100" height="26" rx="4" fill="${r}"/><text x="200" y="101" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">SHOP</text>`}
  else{b=`<polygon points="30,238 370,238 336,176 64,176" fill="#7FB36F"/><polygon points="30,238 370,238 336,176 64,176" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="8 6"/><circle cx="30" cy="238" r="5" fill="${r}"/><circle cx="370" cy="238" r="5" fill="${r}"/><circle cx="336" cy="176" r="5" fill="${r}"/><circle cx="64" cy="176" r="5" fill="${r}"/><rect x="196" y="122" width="6" height="84" fill="#6B4A32"/><rect x="146" y="98" width="106" height="38" rx="5" fill="${r}"/><text x="199" y="123" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">FOR SALE</text><circle cx="42" cy="196" r="20" fill="#5FA36A"/><circle cx="364" cy="198" r="16" fill="#5FA36A"/>`}
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s1}"/><stop offset="1" stop-color="${s2}"/></linearGradient></defs><rect width="400" height="300" fill="url(#a)"/><circle cx="335" cy="55" r="26" fill="#FFE9A8"/><rect y="232" width="400" height="68" fill="${g}"/>${t==='plot'?'':''}${b}</svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}

function card(p){
  const mine=p.seller_id===me.id;
  return `<article class="card"><div class="ph"><img src="${p.image||PHOTOS[p.title]||art(p.type,p.id)}" data-t="${p.type}" data-id="${p.id}" alt="${esc(p.title)}" loading="lazy">
    <span class="tag">${LABEL[p.type]}</span>
    <button class="heart${p.fav?' on':''}" data-id="${p.id}" aria-pressed="${!!p.fav}" aria-label="Save to favourites">${HEART}</button></div>
    <div class="bd"><div class="pr">${money(p.price)}</div><h3>${esc(p.title)}</h3><p class="loc">${esc(p.city)}</p>
    ${p.description?`<p class="ds">${esc(p.description)}</p>`:''}
    <div class="meta">${p.area_size?`<span>${esc(p.area_size)}</span>`:''}${p.beds!=null?`<span>${p.beds} beds</span>`:''}${p.baths!=null?`<span>${p.baths} baths</span>`:''}</div>
    ${mine?`<button class="del" data-del="${p.id}">Delete listing</button>`:''}</div></article>`}

function render(){
  const list=all.filter(p=>(type==='all'||p.type===type)&&(!favOnly||p.fav)&&(!q||(p.title+' '+p.city).toLowerCase().includes(q)));
  $('#count').textContent=list.length+(list.length===1?' property':' properties');
  $('#grid').innerHTML=list.length?list.map(card).join(''):'<div class="empty">Nothing here yet. Try another filter, or add a new property.</div>'}

function chips(){
  const items=[['all','All'],['house','Houses'],['apartment','Apartments'],['shop','Shops'],['plot','Plots'],['fav','♥ Favourites']];
  $('#chips').innerHTML=items.map(([k,l])=>`<button class="chip" data-k="${k}" aria-pressed="${k==='all'}">${l}</button>`).join('')}
$('#chips').addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;const k=c.dataset.k;
  if(k==='fav'){favOnly=!favOnly;c.setAttribute('aria-pressed',favOnly)}
  else{type=k;document.querySelectorAll('.chip[data-k]:not([data-k=fav])').forEach(x=>x.setAttribute('aria-pressed',x===c))}
  render()});
$('#q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();render()});

$('#grid').addEventListener('click',async e=>{
  const h=e.target.closest('.heart');
  if(h){const p=all.find(x=>x.id==h.dataset.id);p.fav=!p.fav;h.classList.toggle('on',p.fav);h.setAttribute('aria-pressed',p.fav);
    if(favOnly)render();
    try{await api(`/api/properties/${p.id}/favorite`,{method:'POST'})}catch(err){p.fav=!p.fav;render();toast(err.message)}return}
  const d=e.target.closest('[data-del]');
  if(d&&confirm('Delete this listing?')){
    try{await api('/api/properties/'+d.dataset.del,{method:'DELETE'});all=all.filter(x=>x.id!=d.dataset.del);render();toast('Listing deleted')}catch(err){toast(err.message)}}});

/* add property */
const dlg=$('#dlg'),pf=$('#pf');
function rooms(){const on=['house','apartment'].includes(pf.type.value);document.querySelectorAll('.rm').forEach(l=>l.hidden=!on)}
pf.type.addEventListener('change',rooms);
$('#add').addEventListener('click',()=>{rooms();dlg.showModal()});
['#x','#cancel'].forEach(s=>$(s).addEventListener('click',()=>dlg.close()));
function shrink(file){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.82))};
  im.onerror=no;im.src=u})}
$('#ph').addEventListener('change',async e=>{
  const f=e.target.files[0];photo=null;$('#pv').hidden=true;if(!f)return;
  try{photo=await shrink(f);$('#pv').src=photo;$('#pv').hidden=false}catch{$('#fe').textContent='Could not read that image.'}});
pf.addEventListener('submit',async e=>{
  e.preventDefault();$('#fe').textContent='';
  const b=Object.fromEntries(new FormData(pf));b.image=photo;
  if(!b.title.trim()||!b.city.trim()||!(+b.price>0)){$('#fe').textContent='Please fill in title, city and a valid price.';return}
  $('#save').disabled=true;$('#save').textContent='Publishing…';
  try{await api('/api/properties',{method:'POST',body:JSON.stringify(b)});
    dlg.close();pf.reset();photo=null;$('#pv').hidden=true;await load();toast('Property published')}
  catch(err){$('#fe').textContent=err.message}
  finally{$('#save').disabled=false;$('#save').textContent='Publish'}});

document.addEventListener('error',e=>{const i=e.target;if(i&&i.tagName==='IMG'&&i.dataset.t&&!i.dataset.fb){i.dataset.fb='1';i.src=art(i.dataset.t,+i.dataset.id)}},true);
$('#out').addEventListener('click',async()=>{try{await api('/api/logout',{method:'POST'})}catch{}location.href='/'});
async function load(){all=(await api('/api/properties')).properties;render()}

(async()=>{
  chips();
  try{me=(await api('/api/me')).user}catch{return}
  $('#who').textContent=me.name;$('#av').textContent=me.name.trim()[0].toUpperCase();
  if(me.role!=='seller'){$('#add').hidden=true;$('#count').textContent='';
    $('#grid').innerHTML='<div class="empty">This page is for sellers. Buyer and admin pages are coming soon.</div>';return}
  try{await load()}catch(err){$('#count').textContent=err.message}
})();
</script>
</body>
</html>
